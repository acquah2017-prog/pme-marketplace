<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PME Marketplace Côte d'Ivoire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 90%;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus {
            border-color: #e67e22;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #d35400;
        }
        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #777;
            margin-top: auto;
        }
        .admin-dot {
            color: inherit;
            text-decoration: none;
            cursor: default;
        }
    </style>
</head>
<body>

    <header>
        <h1>PME Marketplace Côte d'Ivoire</h1>
        <p>Espace de Connexion Membres</p>
    </header>

    <div class="container">
        <h2>Bon retour !</h2>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Adresse Email</label>
                <input type="email" name="email" required placeholder="exemple@gmail.com">
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required placeholder="********">
            </div>

            <button type="submit" class="btn">Se connecter</button>
        </form>
    </div>

    <footer>
        <p>© 2026 PME Marketplace Côte d'Ivoire. Tous droits réservés<a href="/login-admin" class="admin-dot">.</a></p>
    </footer>

</body>
</html>
