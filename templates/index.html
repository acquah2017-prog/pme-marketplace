<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PME Marketplace Côte d'Ivoire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- En-tête / Navbar -->
    <nav class="bg-orange-600 text-white shadow-lg p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">🇨🇮 PME Marketplace (Bassam & National)</h1>
        <div>
            <a href="#connexion" class="px-3 py-2 bg-white text-orange-600 rounded-lg font-semibold mr-2">Connexion</a>
            <a href="#inscription" class="px-3 py-2 bg-orange-800 text-white rounded-lg font-semibold">S'inscrire</a>
        </div>
    </nav>

    <!-- Bannière Principale -->
    <header class="text-center py-12 bg-white border-b">
        <h2 class="text-3xl font-extrabold text-gray-900">Mise en relation des PME & Prestataires en Côte d'Ivoire</h2>
        <p class="mt-2 text-gray-600">Trouvez des partenaires de confiance, soumettez vos appels d'offres et développez vos affaires.</p>
    </header>

    <!-- Formulaires Inscription / Connexion -->
    <div class="max-w-4xl mx-auto my-8 p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Formulaire d'Inscription -->
        <div id="inscription" class="bg-white p-6 rounded-xl shadow-md border">
            <h3 class="text-xl font-bold mb-4 text-orange-600">Créer un compte PME</h3>
            <form action="/inscription-web" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Nom complet / Nom de l'entreprise</label>
                    <input type="text" name="nom" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Adresse Email</label>
                    <input type="email" name="email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Mot de passe</label>
                    <input type="password" name="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Rôle / Profil</label>
                    <select name="role" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-orange-500">
                        <option value="commercant">Commerçant / PME</option>
                        <option value="prestataire">Prestataire de services</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-bold hover:bg-orange-700">S'inscrire gratuitement</button>
            </form>
        </div>

        <!-- Formulaire de Connexion -->
        <div id="connexion" class="bg-white p-6 rounded-xl shadow-md border">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Espace Connexion</h3>
            <form action="/connexion-web" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Email</label>
                    <input type="email" name="username" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-gray-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Mot de passe</label>
                    <input type="password" name="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-gray-500">
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white py-2 rounded-lg font-bold hover:bg-gray-900">Se connecter</button>
            </form>
        </div>

    </div>

</body>
</html>
